<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Suzhou Day Plans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
/* Layout: header with language and music controls, area tabs, theme chips, then a two-pane stage. Left is a sticky schematic map whose camera follows the stop currently crossing a reading line as you scroll. Right is the plan narrative. On phones the map pins to the top and the stops scroll beneath it. */
:root {
  --bg: #EDF1F0;
  --surface: #FFFFFF;
  --ink: #12262B;
  --muted: #52676C;
  --line: #CAD7D5;
  --land: #E2EAE8;
  --city: #ECF1EF;
  --water: #BCD7DA;
  --water-line: #9CC1C5;
  --hill: #C9D8D0;
  --on-accent: #FFFFFF;
  --a-city: #A8322D;
  --a-gardens: #2A7A4B;
  --a-outdoors: #1D6F8A;
  --a-modern: #3A4DA0;
  --a-night: #6A3FA0;
  --spa: #8A5F06;
  --accent: var(--a-city);
  --font-display: 'Bricolage Grotesque', 'Noto Sans SC', system-ui, sans-serif;
  --font-body: 'Noto Sans SC', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1A1D;
    --surface: #132428;
    --ink: #E5EEED;
    --muted: #9AB0B3;
    --line: #264047;
    --land: #0F2125;
    --city: #132A2F;
    --water: #17414A;
    --water-line: #2A6670;
    --hill: #1D3A36;
    --on-accent: #0C1A1D;
    --a-city: #F08A80;
    --a-gardens: #6CC48F;
    --a-outdoors: #6CC2DE;
    --a-modern: #98A9F3;
    --a-night: #C3A0F2;
    --spa: #E8B84E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1A1D;
  --surface: #132428;
  --ink: #E5EEED;
  --muted: #9AB0B3;
  --line: #264047;
  --land: #0F2125;
  --city: #132A2F;
  --water: #17414A;
  --water-line: #2A6670;
  --hill: #1D3A36;
  --on-accent: #0C1A1D;
  --a-city: #F08A80;
  --a-gardens: #6CC48F;
  --a-outdoors: #6CC2DE;
  --a-modern: #98A9F3;
  --a-night: #C3A0F2;
  --spa: #E8B84E;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 30;
  background: var(--bg);
}
.page {
  max-width: 1360px;
  margin-inline: auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 64px;
}
.page[data-area="city"] { --accent: var(--a-city); }
.page[data-area="gardens"] { --accent: var(--a-gardens); }
.page[data-area="outdoors"] { --accent: var(--a-outdoors); }
.page[data-area="modern"] { --accent: var(--a-modern); }
.page[data-area="night"] { --accent: var(--a-night); }

h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
button { font-family: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 28px; }
.titleblock { min-width: 0; flex: 1 1 380px; }
h1 { font-size: clamp(30px, 4.6vw, 50px); line-height: 1.05; font-weight: 800; letter-spacing: -0.02em; }
.lede { margin: 10px 0 0; color: var(--muted); max-width: 54ch; font-size: 16px; }
.ctrls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; color: var(--ink); font-size: 13px; font-weight: 500; padding: 8px 14px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.music { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 8px 14px; font-size: 13px; font-weight: 500; cursor: pointer; }
.music .state { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; padding: 2px 6px; border-radius: 4px; background: var(--bg); color: var(--muted); }
.music[aria-pressed="true"] { border-color: var(--accent); }
.music[aria-pressed="true"] .state { background: var(--accent); color: var(--on-accent); }


/* areas */
.areas { margin-top: 22px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
.area-btn { text-align: left; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.area-btn .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-bottom: 4px; }
.area-btn .an { font-family: var(--font-display); font-weight: 800; font-size: 18px; line-height: 1.15; }
.area-btn .ab { font-size: 12.5px; line-height: 1.4; color: var(--muted); }
.area-btn:hover { border-color: var(--c); }
.area-btn[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: var(--on-accent); }
.area-btn[aria-pressed="true"] .ab { color: var(--on-accent); opacity: .92; }
.area-btn[aria-pressed="true"] .dot { background: var(--on-accent); }

.themes { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
.theme-btn { display: inline-flex; align-items: baseline; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 500; cursor: pointer; }
.theme-btn small { font: 400 11px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.theme-btn:hover { border-color: var(--accent); }
.theme-btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.theme-btn[aria-pressed="true"] small { color: var(--on-accent); opacity: .9; }

/* stage */
.stage { margin-top: 26px; display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px; align-items: start; }
.mapcol { position: sticky; top: max(16px, env(safe-area-inset-top, 0px)); z-index: 5; }
.mapbox { position: relative; isolation: isolate; height: min(calc(100dvh - 32px), 840px); min-height: 440px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--land); }

/* narrative */
.listcol { min-width: 0; }
.plan-head h2 { font-size: clamp(28px, 3.4vw, 42px); line-height: 1.06; font-weight: 800; color: var(--accent); letter-spacing: -0.01em; }
.meta { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.badge { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--accent); color: var(--accent); }
.who { margin: 12px 0 0; font-size: 18px; line-height: 1.4; max-width: 40ch; }
.note { margin: 8px 0 0; color: var(--muted); font-size: 14px; max-width: 52ch; }
.music-line { margin: 12px 0 0; font-size: 13.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; }
.music-line b { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.music-line a { color: var(--ink); text-underline-offset: 3px; }
.cue { margin-top: 20px; font: 400 12px var(--font-mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.stops { list-style: none; margin: 18px 0 0; padding: 0; display: flex; flex-direction: column; gap: 14vh; }
.stop { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 12px; padding: 16px 16px 16px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; transition: border-color .2s; }
.stop.is-active { border-color: var(--accent); }
.stop.sp-stop { border-color: var(--spa); }
.num { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font: 500 13px var(--font-mono); }
.stop.sp-stop .num { background: var(--spa); border-radius: 7px; }
.sbody { min-width: 0; }
.row1 { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 12px; }
.stop h3 { font-size: 20px; line-height: 1.2; font-weight: 800; }
.when { font: 400 12px var(--font-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.stop p { margin: 8px 0 0; max-width: 60ch; }
.fig { margin: 12px 0 0; }
.fig img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px; background: var(--land); }
.fig .ph { width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; border: 1px dashed var(--line); background: repeating-linear-gradient(135deg, var(--land) 0 10px, var(--city) 10px 20px); display: grid; place-items: center; text-align: center; padding: 12px; color: var(--muted); font: 400 12px var(--font-mono); letter-spacing: .06em; text-transform: uppercase; }
.fig figcaption { margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.tbd { display: inline-block; margin-top: 8px; font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border: 1px dashed var(--muted); border-radius: 4px; padding: 2px 8px; }
.spabox { margin-top: 12px; padding: 12px 14px; border-radius: 8px; background: color-mix(in srgb, var(--spa) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--spa) 45%, var(--line)); font-size: 13.5px; }
.spabox b { font: 500 11px var(--font-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--spa); }
.spabox p { margin: 6px 0 0; max-width: none; }
.acts { margin-top: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.save { font-size: 13px; font-weight: 500; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 5px 12px; cursor: pointer; }
.save:hover { border-color: var(--accent); }
.save[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.ext { font-size: 13px; color: var(--ink); text-underline-offset: 3px; }

.picks { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--line); }
.picks h3 { font-size: 20px; font-weight: 800; }
.picks .hint { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
.chips { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 13.5px; }
.chip button { width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--bg); color: var(--ink); cursor: pointer; line-height: 1; }
.clear { margin-top: 12px; font-size: 13px; font-weight: 500; background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 0; }
.credits { margin-top: 28px; font-size: 13px; color: var(--muted); }
.credits h3 { font-size: 15px; color: var(--ink); font-weight: 800; }
.credits ul { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; }
.credits a { color: var(--ink); text-underline-offset: 3px; }
.foot { margin-top: 26px; font-size: 13px; color: var(--muted); max-width: 62ch; }
.foot p { margin: 0 0 8px; }

@media (max-width: 1100px) {
  .areas { display: flex; overflow-x: auto; padding-bottom: 6px; }
  .area-btn { flex: 0 0 190px; }
}
@media (max-width: 820px) {
  .stage { grid-template-columns: minmax(0, 1fr); gap: 16px; }
  .mapcol { top: env(safe-area-inset-top, 0px); }
  .mapbox { height: 42vh; min-height: 280px; }
  .stops { gap: 18px; }
  .stop { scroll-margin-top: calc(42vh + 24px); }
}


/* map (Leaflet) */
#map { position: absolute; inset: 0; background: var(--land); font-family: var(--font-body); }
.leaflet-container a { color: inherit; }
.mkicon { background: none; border: 0; }
.mkicon .pin { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--on-accent); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); font: 500 12px var(--font-mono); transition: transform .2s, box-shadow .2s; }
.mkicon .pin i { font-style: normal; }
.mkicon.is-active .pin { transform: scale(1.25); box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 40%, transparent), 0 1px 4px rgba(0,0,0,.35); }
.leaflet-marker-icon:focus-visible .pin { outline: 2px solid #000; outline-offset: 2px; }
path.route { stroke: var(--accent); }
.leaflet-tooltip.lbl { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.25); font: 700 12.5px var(--font-body); padding: 3px 8px; }
.leaflet-tooltip.lbl::before { display: none; }
.mapbtns { position: absolute; left: 10px; bottom: 28px; z-index: 1100; display: flex; gap: 6px; }
.mapbtns button { font-size: 12.5px; font-weight: 500; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 6px 12px; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
.leaflet-control-attribution { font-size: 11px; }
.ext + .ext::before { content: "·"; margin-right: 14px; color: var(--muted); text-decoration: none; display: inline-block; }
</style>
</head>
<body>
<div class="page" id="page" data-area="city">
  <header class="top">
    <div class="titleblock">
      <h1 id="h1"></h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="ctrls">
      <div class="seg" id="langseg" role="group" aria-label="Language">
        <button type="button" data-l="en" aria-pressed="true">EN</button>
        <button type="button" data-l="zh" aria-pressed="false" lang="zh">中文</button>
      </div>
      <button type="button" class="music" id="music" aria-pressed="false"></button>
    </div>
  </header>

  <nav class="areas" id="areas" aria-label="Areas"></nav>
  <div class="themes" id="themes" role="group" aria-label="Plans"></div>

  <main class="stage">
    <section class="mapcol" aria-label="Map">
      <div class="mapbox" id="mapbox">
        <div id="map"></div>
        <div class="mapbtns"><button type="button" id="allbtn"></button></div>
      </div>
    </section>

    <section class="listcol" aria-label="Plan">
      <div class="plan-head" id="planhead"></div>
      <ol class="stops" id="stops"></ol>
      <div class="picks" id="picks"></div>
      <div class="credits" id="credits"></div>
      <div class="foot" id="foot"></div>
    </section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>

  /* ---------- state ---------- */
  var LANG = 'en';
  var planId = 'city-walk';
  var active = -1;
  var saved = [];
  var musicOn = false;
  var audio = null;
  var stopEls = [];
  var markers = [];
  var routeLine = null;
  var layer = null;
  var map = null;
  var SPA_Q = '曲水兰亭 苏州工业园区李公堤三期1号楼';
  var ZOOM = { tianping: 14, lingyan: 14, peninsula: 14, bacheng: 14 };
  var RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  try {
    LANG = localStorage.getItem('suzhou-lang') === 'zh' ? 'zh' : 'en';
    var rs = JSON.parse(localStorage.getItem('suzhou-saved') || '[]');
    if (Array.isArray(rs)) saved = rs.filter(function (id) { return PLACES[id]; });
  } catch (e) {}
  function persist() { try { localStorage.setItem('suzhou-saved', JSON.stringify(saved)); } catch (e) {} }

  var hh = (location.hash || '').replace('#', '');
  if (PLANS[hh]) planId = hh;

  var $ = function (s) { return document.querySelector(s); };
  function tx(o) { return o[LANG]; }
  function T(k) { return I18N[k][LANG]; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

  /* ---------- header ---------- */
  function renderHeader() {
    document.documentElement.lang = LANG === 'zh' ? 'zh' : 'en';
    $('#h1').textContent = T('h1');
    $('#lede').textContent = T('lede');
    var bs = document.querySelectorAll('#langseg button');
    for (var i = 0; i < bs.length; i++) bs[i].setAttribute('aria-pressed', String(bs[i].getAttribute('data-l') === LANG));
    $('#allbtn').textContent = T('all');
    $('#foot').innerHTML = '<p>' + T('foot1') + '</p>';
    renderCredits();
    renderMusicBtn();
  }

  function renderAreas() {
    var cur = PLANS[planId].area;
    $('#areas').innerHTML = AREAS.map(function (a) {
      return '<button type="button" class="area-btn" data-a="' + a.id + '" style="--c:var(--a-' + a.id + ')" aria-pressed="' + (a.id === cur) + '">' +
        '<span class="dot"></span><span class="an">' + tx(a) + '</span><span class="ab">' + (LANG === 'zh' ? a.bZh : a.bEn) + '</span></button>';
    }).join('');
    var area = AREAS.filter(function (a) { return a.id === cur; })[0];
    $('#themes').innerHTML = area.themes.map(function (id) {
      var p = PLANS[id];
      return '<button type="button" class="theme-btn" data-p="' + id + '" aria-pressed="' + (id === planId) + '">' + tx(p.name) + '<small>' + (p.len === 'half' ? T('half') : T('full')) + '</small></button>';
    }).join('');
    $('#page').setAttribute('data-area', cur);
  }

  /* ---------- soundtrack ---------- */
  function trackFor(id) { return MUSIC[id] || MUSIC_AREA[PLANS[id].area] || { title: null, file: '', link: '', credit: '' }; }
  function renderMusicBtn() {
    var b = $('#music');
    b.setAttribute('aria-pressed', String(musicOn));
    b.innerHTML = '<span>♪ ' + T('music') + '</span><span class="state">' + (musicOn ? T('on') : T('off')) + '</span>';
  }
  function syncAudio() {
    var tr = trackFor(planId);
    if (!musicOn) { if (audio) audio.pause(); return; }
    if (!audio) { audio = new Audio(); audio.loop = true; audio.volume = DEFAULT_VOLUME; }
    if (tr.file) {
      if (audio.getAttribute('data-src') !== tr.file) { audio.setAttribute('data-src', tr.file); audio.src = tr.file; }
      if (musicOn) { var pr = audio.play(); if (pr && pr.catch) pr.catch(function () {}); } else audio.pause();
    } else {
      audio.pause();
    }
  }

  /* ---------- plan narrative ---------- */
  function linksFor(p, id) {
    var q = id === 'spa' ? SPA_Q : p.zh + ' ' + p.en + ' Suzhou';
    var g = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
    var a = 'https://www.amap.com/search?query=' + encodeURIComponent(id === 'spa' ? SPA_Q : p.zh + ' 苏州');
    return '<a class="ext" target="_blank" rel="noopener" href="' + a + '">' + T('openA') + '</a>' +
           '<a class="ext" target="_blank" rel="noopener" href="' + g + '">' + T('openG') + '</a>';
  }
  function figureFor(pid, i, p) {
    var im = IMAGES[pid + ':' + i] || IMAGES[PLANS[pid].stops[i].p];
    if (im && im.src) {
      var alt = im.alt ? esc(tx(im.alt)) : esc(tx(p));
      return '<figure class="fig"><img src="' + esc(im.src) + '" alt="' + alt + '" loading="lazy">' + (im.credit ? '<figcaption>' + esc(im.credit) + '</figcaption>' : '') + '</figure>';
    }
    return '<figure class="fig"><div class="ph" role="img" aria-label="' + T('imgTbd') + ': ' + esc(tx(p)) + '">' + T('imgTbd') + '<br>' + esc(tx(p)) + '</div></figure>';
  }
  function renderPlan() {
    var plan = PLANS[planId];
    var tr = trackFor(planId);
    var musicLine;
    if (tr.link) musicLine = '<a href="' + esc(tr.link) + '" target="_blank" rel="noopener">' + T('openList') + '</a>';
    else musicLine = '<span>' + T('linkTbd') + '</span>';
    if (!tr.file) musicLine += '<span>·</span><span>' + T('noTrack') + '</span>';
    else if (tr.title) musicLine += '<span>·</span><span>' + esc(tx(tr.title)) + '</span>';

    $('#planhead').innerHTML =
      '<h2>' + tx(plan.name) + '</h2>' +
      '<div class="meta"><span class="badge">' + (plan.len === 'half' ? T('half') : T('full')) + '</span><span class="badge">' + tx(AREAS.filter(function (a) { return a.id === plan.area; })[0]) + '</span></div>' +
      '<p class="who">' + tx(plan.who) + '</p><p class="note">' + tx(plan.note) + '</p>' +
      '<p class="music-line"><b>♪ ' + T('music') + '</b>' + musicLine + '</p>' +
      '<p class="cue">' + T('cue') + ' &darr;</p>';

    $('#stops').innerHTML = plan.stops.map(function (s, i) {
      var p = PLACES[s.p], on = saved.indexOf(s.p) > -1;
      return '<li class="stop" data-i="' + i + '" id="stop-' + i + '">' +
        '<span class="num">' + (i + 1) + '</span>' +
        '<div class="sbody"><div class="row1"><h3>' + tx(p) + ' <span class="when" style="text-transform:none;letter-spacing:0">' + (LANG === 'zh' ? p.en : p.zh) + '</span></h3><span class="when">' + tx(TIMES[s.t]) + '</span></div>' +
        figureFor(planId, i, p) +
        '<p>' + s[LANG] + '</p>' +
        (p.tbd ? '<span class="tbd">' + T('tbd') + '</span>' : '') +
        (s.p === 'spa' ? '<div class="spabox"><b>' + T('details') + '</b><p><strong>' + T('spaTitle') + '</strong></p><p>' + T('spaBody') + '</p></div>' : '') +
        '<div class="acts"><button type="button" class="save" data-p="' + s.p + '" aria-pressed="' + on + '">' + (on ? T('saved') : T('save')) + '</button>' +
        linksFor(p, s.p) + '</div></div></li>';
    }).join('');
    stopEls = Array.prototype.slice.call(document.querySelectorAll('.stop'));
  }

  function renderCredits() {
    var seen = {}, rows = [];
    function add(t) { if (t && t.credit && !seen[t.credit]) { seen[t.credit] = 1; rows.push(t); } }
    Object.keys(MUSIC).forEach(function (k) { add(MUSIC[k]); });
    Object.keys(MUSIC_AREA).forEach(function (k) { add(MUSIC_AREA[k]); });
    $('#credits').innerHTML = rows.length ? '<h3>' + T('creditsH') + '</h3><ul>' + rows.map(function (t) {
      return '<li>' + (t.link ? '<a href="' + esc(t.link) + '" target="_blank" rel="noopener">' + esc(t.credit) + '</a>' : esc(t.credit)) + '</li>';
    }).join('') + '</ul>' : '';
  }
  function renderPicks() {
    var el = $('#picks');
    if (!saved.length) { el.innerHTML = '<h3>' + T('picks') + '</h3><p class="hint">' + T('picksHint') + '</p>'; return; }
    el.innerHTML = '<h3>' + T('picks') + ' (' + saved.length + ')</h3><ul class="chips">' + saved.map(function (id) {
      var p = PLACES[id];
      return '<li class="chip"><span>' + tx(p) + '</span><button type="button" data-rm="' + id + '" aria-label="Remove">&times;</button></li>';
    }).join('') + '</ul><button type="button" class="clear" id="clear">' + T('clear') + '</button>';
  }

  /* ---------- map (Leaflet + OpenStreetMap) ---------- */
  function initMap() {
    map = L.map('map', {
      scrollWheelZoom: false,          // keeps the page scroll working over the map
      dragging: !L.Browser.mobile,     // one-finger drag would block page scroll on phones
      tap: false,
      zoomSnap: 0.5
    }).setView([31.31, 120.63], 12);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      maxZoom: 19
    }).addTo(map);

    layer = L.layerGroup().addTo(map);
  }

  function ll(id) { return [PLACES[id].lat, PLACES[id].lon]; }

  function buildMarkers() {
    layer.clearLayers();
    markers = [];
    var plan = PLANS[planId];
    var pts = plan.stops.map(function (s) { return ll(s.p); });
    routeLine = L.polyline(pts, { className: 'route', weight: 3, dashArray: '1 8', lineCap: 'round', interactive: false }).addTo(layer);
    plan.stops.forEach(function (s, i) {
      var p = PLACES[s.p];
      var m = L.marker(ll(s.p), {
        icon: L.divIcon({ className: 'mkicon', html: '<span class="pin"><i>' + (i + 1) + '</i></span>', iconSize: [30, 30], iconAnchor: [15, 15] }),
        title: tx(p),
        riseOnHover: true
      }).addTo(layer);
      m.bindTooltip(esc(tx(p)), { direction: 'right', offset: [18, 0], className: 'lbl' });
      m.on('click', function () { scrollToStop(i); });
      markers.push(m);
    });
  }

  function boundsPad() { return window.innerWidth < 560 ? [36, 36] : [70, 70]; }
  function fitAll(animate) {
    var b = L.latLngBounds(PLANS[planId].stops.map(function (s) { return ll(s.p); }));
    var opts = { padding: boundsPad(), maxZoom: 14 };
    if (animate && !RM) map.flyToBounds(b, { padding: opts.padding, maxZoom: 14, duration: 0.9 });
    else map.fitBounds(b, { padding: opts.padding, maxZoom: 14, animate: false });
  }
  function flyTo(idx, animate) {
    var id = PLANS[planId].stops[idx].p;
    var z = ZOOM[id] || 15;
    if (animate && !RM) map.flyTo(ll(id), z, { duration: 0.9 });
    else map.setView(ll(id), z, { animate: false });
  }

  function setActive(idx, instant) {
    active = idx;
    stopEls.forEach(function (el, i) { el.classList.toggle('is-active', i === idx); });
    markers.forEach(function (m, i) {
      var el = m.getElement();
      if (el) el.classList.toggle('is-active', i === idx);
      if (i === idx) m.openTooltip(); else m.closeTooltip();
    });
    if (idx < 0) fitAll(!instant); else flyTo(idx, !instant);
  }

  /* ---------- scroll reading line ---------- */
  var ticking = false;
  function refY() {
    if (window.innerWidth <= 820) return $('#mapbox').getBoundingClientRect().bottom + 24;
    return window.innerHeight * 0.5;
  }
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      ticking = false;
      var y = refY(), idx = -1;
      for (var i = 0; i < stopEls.length; i++) { if (stopEls[i].getBoundingClientRect().top <= y) idx = i; }
      if (idx !== active) setActive(idx, false);
    });
  }
  function scrollToStop(i) {
    var el = stopEls[i];
    if (!el) return;
    var top = el.getBoundingClientRect().top + window.scrollY - refY() + 8;
    window.scrollTo({ top: top, behavior: RM ? 'auto' : 'smooth' });
  }

  /* ---------- wiring ---------- */
  function setPlan(id, keepScroll) {
    planId = id; active = -1;
    renderAreas(); renderPlan(); syncAudio();
    map.invalidateSize();
    buildMarkers();
    setActive(-1, true);
    if (!keepScroll) {
      var st = $('.stage').getBoundingClientRect().top + window.scrollY - 12;
      if (window.scrollY > st) window.scrollTo(0, st);
    }
    onScroll();
  }
  function refreshLang() {
    renderHeader(); renderAreas(); renderPlan(); renderPicks();
    buildMarkers();
    var keep = active;
    setActive(keep, true);
  }
  function refreshSaveButtons() {
    var all = document.querySelectorAll('.save');
    for (var i = 0; i < all.length; i++) {
      var on = saved.indexOf(all[i].getAttribute('data-p')) > -1;
      all[i].setAttribute('aria-pressed', String(on));
      all[i].textContent = on ? T('saved') : T('save');
    }
  }

  document.addEventListener('click', function (e) {
    var t = e.target;
    var a = t.closest('.area-btn');
    if (a) { var area = AREAS.filter(function (x) { return x.id === a.getAttribute('data-a'); })[0]; setPlan(area.themes[0]); return; }
    var th = t.closest('.theme-btn');
    if (th) { setPlan(th.getAttribute('data-p')); return; }
    var lg = t.closest('#langseg button');
    if (lg) { LANG = lg.getAttribute('data-l'); try { localStorage.setItem('suzhou-lang', LANG); } catch (er) {} refreshLang(); return; }
    if (t.closest('#music')) { musicOn = !musicOn; renderMusicBtn(); syncAudio(); return; }
    if (t.closest('#allbtn')) { setActive(-1, false); return; }
    var sv = t.closest('.save');
    if (sv) {
      var id = sv.getAttribute('data-p'), at = saved.indexOf(id);
      if (at > -1) saved.splice(at, 1); else saved.push(id);
      persist(); refreshSaveButtons(); renderPicks();
      return;
    }
    var rm = t.closest('[data-rm]');
    if (rm) { saved = saved.filter(function (x) { return x !== rm.getAttribute('data-rm'); }); persist(); refreshSaveButtons(); renderPicks(); return; }
    if (t.closest('#clear')) { saved = []; persist(); refreshSaveButtons(); renderPicks(); }
  });

  window.addEventListener('scroll', onScroll, { passive: true });
  if (window.ResizeObserver) {
    new ResizeObserver(function () { if (map) { map.invalidateSize(); } }).observe($('#map'));
  }

  initMap();
  renderHeader();
  renderPicks();
  setPlan(planId, true);

})();
</script>
</body>
</html>
